name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version and channel
        id: release_version
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "release tag must be SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          channel_version="${version%%+*}"
          prerelease=false
          case "$channel_version" in
            *-*)
              prerelease=true
              prerelease_part="${channel_version#*-}"
              if printf '%s\n' "$prerelease_part" | tr '.' '\n' | grep -Eq '^0[0-9]+$'; then
                echo "release tag has a numeric prerelease identifier with a leading zero: $GITHUB_REF_NAME" >&2
                exit 1
              fi
              ;;
          esac
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Inspect existing release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq '[.[][]]' > "$RUNNER_TEMP/release-api.json"
          matches="$(jq --arg tag "$GITHUB_REF_NAME" '[.[] | select(.tag_name == $tag)]' "$RUNNER_TEMP/release-api.json")"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -gt 1 ]; then
            echo "multiple releases found for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          draft="$(jq -r '.[0].draft' <<<"$matches")"
          release_id="$(jq -r '.[0].id' <<<"$matches")"
          if [ "$draft" = "true" ]; then
            state=draft
          else
            state=published
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Set up pinned release Go
        if: steps.release_state.outputs.state != 'published'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Download modules
        if: steps.release_state.outputs.state != 'published'
        run: go mod download

      - name: Verify release lineage preflight
        if: steps.release_state.outputs.state != 'published'
        run: |
          set -euo pipefail
          go run ./cmd/release-preflight \
            -tag "$GITHUB_REF_NAME" \
            -expected-sha "$GITHUB_SHA" \
            -tag-sha "$(git rev-list -n 1 "$GITHUB_REF_NAME")" \
            -releases-file "$RUNNER_TEMP/release-api.json" \
            > "$RUNNER_TEMP/release-preflight.json"
          test "$(jq -r '.state' "$RUNNER_TEMP/release-preflight.json")" = "${{ steps.release_state.outputs.state }}"
          cat "$RUNNER_TEMP/release-preflight.json"
          echo "GORELEASER_CURRENT_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          latest_published_tag="$(jq -r '.latest_published_tag // empty' "$RUNNER_TEMP/release-preflight.json")"
          if [ -n "$latest_published_tag" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$latest_published_tag" >> "$GITHUB_ENV"
          fi

      - name: Verify stable promotion source commit
        if: steps.release_state.outputs.state != 'published'
        run: |
          set -euo pipefail
          promotion_from="$(jq -r '.promotion_from // empty' "$RUNNER_TEMP/release-preflight.json")"
          if [ -z "$promotion_from" ]; then
            exit 0
          fi
          promotion_sha="$(git rev-list -n 1 "$promotion_from")"
          if [ "$promotion_sha" != "$GITHUB_SHA" ]; then
            echo "stable promotion must reuse the exact latest prerelease commit: $promotion_from=$promotion_sha candidate=$GITHUB_SHA; publish another prerelease first" >&2
            exit 1
          fi

      - name: Verify existing published release
        if: steps.release_state.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json tagName --jq '.tagName')" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = "${{ steps.release_version.outputs.prerelease }}"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 13
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --dir "$tmp" \
            --pattern '115driver_*.tar.gz' \
            --pattern '115driver_*.tar.gz.spdx.json' \
            --pattern 'checksums.txt'
          test "$(find "$tmp" -maxdepth 1 -type f -name '115driver_*.tar.gz' | wc -l)" -eq 6
          test "$(find "$tmp" -maxdepth 1 -type f -name '115driver_*.tar.gz.spdx.json' | wc -l)" -eq 6
          test "$(wc -l < "$tmp/checksums.txt")" -eq 12
          (cd "$tmp" && sha256sum -c checksums.txt)
          for artifact in "$tmp"/*.tar.gz "$tmp"/*.spdx.json "$tmp"/checksums.txt; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/changelog.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF"
          done
          for artifact in "$tmp"/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/changelog.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Run complete release readiness gate
        if: steps.release_state.outputs.state != 'published'
        env:
          CGO_ENABLED: "1"
          COOKIE: "UID=1;CID=2;SEID=3;KID=4"
          RUN_115_INTEGRATION: "0"
          RUN_115_DESTRUCTIVE_INTEGRATION: "0"
        run: make release-ready-race

      - name: Download pinned Syft
        if: steps.release_state.outputs.state != 'published'
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0

      - name: Add pinned Syft to PATH
        if: steps.release_state.outputs.state != 'published'
        run: |
          syft_cmd="${{ steps.syft.outputs.cmd }}"
          test -n "$syft_cmd"
          echo "$(dirname "$syft_cmd")" >> "$GITHUB_PATH"

      - name: Verify pinned Syft
        if: steps.release_state.outputs.state != 'published'
        run: syft version

      - name: Build GoReleaser final-version release candidate
        if: steps.release_state.outputs.state != 'published'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --skip=publish --parallelism=1

      - name: Verify GoReleaser final-version release candidate
        if: steps.release_state.outputs.state != 'published'
        run: make verify-release-artifacts EXPECTED_ARTIFACT_VERSION="${GITHUB_REF_NAME#v}"

      - name: Attest verified release archives
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Attest archive checksum manifest
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/checksums.txt

      - name: Attest Linux x86_64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_linux_x86_64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_linux_x86_64.tar.gz.spdx.json

      - name: Attest Linux aarch64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_linux_aarch64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_linux_aarch64.tar.gz.spdx.json

      - name: Attest Darwin x86_64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_darwin_x86_64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_darwin_x86_64.tar.gz.spdx.json

      - name: Attest Darwin aarch64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_darwin_aarch64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_darwin_aarch64.tar.gz.spdx.json

      - name: Attest Windows x86_64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_windows_x86_64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_windows_x86_64.tar.gz.spdx.json

      - name: Attest Windows aarch64 archive SBOM
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_windows_aarch64.tar.gz
          sbom-path: ./dist/115driver_${{ steps.release_version.outputs.version }}_windows_aarch64.tar.gz.spdx.json

      - name: Verify release candidate provenance and SBOM attestations
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.spdx.json dist/checksums.txt; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/changelog.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF"
          done
          for artifact in dist/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/changelog.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Generate release notes
        if: steps.release_state.outputs.state != 'published'
        run: go run ./cmd/release-notes -tag "${GITHUB_REF_NAME}" > .release-notes.md

      - name: Stage or repair verified release draft
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ steps.release_state.outputs.state }}" in
            absent)
              gh release create "$GITHUB_REF_NAME" \
                dist/*.tar.gz \
                dist/*.spdx.json \
                dist/checksums.txt \
                --draft \
                --prerelease=${{ steps.release_version.outputs.prerelease }} \
                --verify-tag \
                --title "$GITHUB_REF_NAME" \
                --notes-file .release-notes.md
              ;;
            draft)
              test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
              gh release edit "$GITHUB_REF_NAME" \
                --draft=true \
                --prerelease=${{ steps.release_version.outputs.prerelease }} \
                --verify-tag \
                --title "$GITHUB_REF_NAME" \
                --notes-file .release-notes.md
              gh release upload "$GITHUB_REF_NAME" \
                dist/*.tar.gz \
                dist/*.spdx.json \
                dist/checksums.txt \
                --clobber
              ;;
            *)
              echo "refusing to mutate release state ${{ steps.release_state.outputs.state }}" >&2
              exit 1
              ;;
          esac

      - name: Verify staged release assets
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = "${{ steps.release_version.outputs.prerelease }}"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 13
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --dir "$tmp" \
            --pattern '115driver_*.tar.gz' \
            --pattern '115driver_*.tar.gz.spdx.json' \
            --pattern 'checksums.txt'
          test "$(find "$tmp" -maxdepth 1 -type f -name '115driver_*.tar.gz' | wc -l)" -eq 6
          test "$(find "$tmp" -maxdepth 1 -type f -name '115driver_*.tar.gz.spdx.json' | wc -l)" -eq 6
          test "$(wc -l < "$tmp/checksums.txt")" -eq 12
          cmp dist/checksums.txt "$tmp/checksums.txt"
          (cd "$tmp" && sha256sum -c checksums.txt)

      - name: Publish verified release draft
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json tagName --jq '.tagName')" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = "${{ steps.release_version.outputs.prerelease }}"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 13
