name: test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Test (offline by default)
        env:
          HTTP_PROXY: "http://127.0.0.1:1"
          HTTPS_PROXY: "http://127.0.0.1:1"
          ALL_PROXY: "http://127.0.0.1:1"
          COOKIE: "UID=1;CID=2;SEID=3;KID=4"
          RUN_115_INTEGRATION: "0"
          RUN_115_DESTRUCTIVE_INTEGRATION: "0"
        run: go test ./...

      - name: Build entry points
        run: go build ./cmd/115driver ./cmd/115driver-mcp-server

  sync-session-certification:
    name: sync/session release certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned release Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run complete release readiness gate
        env:
          CGO_ENABLED: "1"
          COOKIE: "UID=1;CID=2;SEID=3;KID=4"
          RUN_115_INTEGRATION: "0"
          RUN_115_DESTRUCTIVE_INTEGRATION: "0"
        run: make release-ready-race

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0

      - name: Add pinned Syft to PATH
        run: |
          syft_cmd="${{ steps.syft.outputs.cmd }}"
          test -n "$syft_cmd"
          echo "$(dirname "$syft_cmd")" >> "$GITHUB_PATH"

      - name: Verify pinned Syft
        run: syft version

      - name: Build GoReleaser release-candidate snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean --skip=publish --parallelism=1

      - name: Verify GoReleaser release-candidate artifacts
        run: make verify-release-artifacts

      - name: Preserve first snapshot archive checksums
        run: |
          grep '\.tar\.gz$' dist/checksums.txt | LC_ALL=C sort > .release-archive-checksums.first
          test "$(wc -l < .release-archive-checksums.first)" -eq 6

      - name: Rebuild GoReleaser snapshot for reproducibility
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean --skip=publish --parallelism=1

      - name: Verify reproducible GoReleaser snapshot archives
        run: |
          grep '\.tar\.gz$' dist/checksums.txt | LC_ALL=C sort > .release-archive-checksums.second
          test "$(wc -l < .release-archive-checksums.second)" -eq 6
          cmp .release-archive-checksums.first .release-archive-checksums.second
          make verify-release-artifacts

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...
